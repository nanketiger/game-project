<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>肉鸽闯关·demo版</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 加载界面 -->
  <div id="loading-screen" class="screen active" style="z-index:999; background: #1a1a2e;">
    <div class="loading-content">
      <h2 style="color:#FFD700; margin-bottom:24px;">平台冒险游戏</h2>
      <div class="loading-bar-track">
        <div class="loading-bar-fill" id="loading-bar-fill"></div>
      </div>
      <p id="loading-text" style="color:#95a5a6; margin-top:12px;">正在准备游戏资源...</p>
    </div>
  </div>

  <!-- 流体粒子背景（开始界面 + 游戏中均可见） -->
  <div class="fluid-particles">
    <div class="fluid-particle"></div>
    <div class="fluid-particle"></div>
    <div class="fluid-particle"></div>
    <div class="fluid-particle"></div>
    <div class="fluid-particle"></div>
    <div class="fluid-particle"></div>
    <div class="fluid-particle"></div>
    <div class="fluid-particle"></div>
    <div class="fluid-particle"></div>
    <div class="fluid-particle"></div>
    <div class="fluid-particle"></div>
    <div class="fluid-particle"></div>
  </div>

  <!-- 开始界面 -->
  <div id="start-screen" class="screen active">
    <div class="start-content">
      <h1>平台冒险游戏</h1>
      <div class="instructions">
        <h3>游戏说明：</h3>
        <p>• 使用 A/D 键左右移动</p>
        <p>• 使用 K 键跳跃</p>
        <p>• 使用 J 键射击</p>
        <p>• 击败所有怪物后会出现传送门</p>
        <p>• 进入传送门进入下一关</p>
        <p>• 小心不要被怪物伤害！</p>
      </div>
      <button id="start-btn" class="start-button">开始游戏</button>
    </div>
  </div>

  <!-- 暂停界面 -->
  <div id="pause-screen" class="screen hidden">
    <div class="pause-content">
      <h1>游戏暂停</h1>
      <div class="volume-control">
        <img class="volume-icon" src="images/ui/音效图标.png" alt="音量">
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="50">
      </div>
      <button id="resume-btn" class="start-button">返回游戏</button>
      <button id="menu-btn" class="start-button">回到主菜单</button>
    </div>
  </div>

  <!-- 胜利界面 -->
  <div id="victory-screen" class="screen hidden">
    <div class="victory-content">
      <h1>恭喜通关！</h1>
      <p>你已成功通过全部 10 个关卡</p>
      <button id="restart-btn" class="start-button">重新开始</button>
    </div>
  </div>

  <!-- 游戏主场景结构 -->
  <div id="game-container" class="screen hidden">
    <div class="sky-background"></div>
    <div class="ground-background"></div>
    <div id="player"></div>
    <div id="health">血量: 3</div>
    <div id="level-info">关卡: 1 / 10</div>
    <div id="game-tip" style="position: absolute; top:60px; left:20px; color:white; font-size:16px;">
      A/D 移动 | K 跳跃 | J 射击 | B背包
    </div>
  </div>

  <audio id="bgm" src="sound/game.wav" loop preload="auto"></audio>

  <script src="js/portalEffect.js"></script>
  <script src="js/playerEffect.js"></script>
  <script src="js/idleAura.js"></script>
  <script src="js/bag.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/monster.js"></script>
  <script src="js/main.js"></script>
  <script src="js/relics.js"></script>
</body>
</html>
